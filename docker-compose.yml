services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  identity.api:
    build:
      context: .
      dockerfile: Identity.Api/Dockerfile
    container_name: identity.api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=IdentityServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
    depends_on:
      - sqlserver

  tasks.api:
    build:
      context: .
      dockerfile: Tasks.Api/Dockerfile
    container_name: tasks.api
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TasksServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - NotificationsApi__BaseUrl=http://notifications.api:8080/
    depends_on:
      - sqlserver
      - notifications.api

  notifications.api:
    build:
      context: .
      dockerfile: Notifications.Api/Dockerfile
    container_name: notifications.api
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=NotificationsServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
    depends_on:
      - sqlserver

volumes:
  sqlserver_data: